name: Verify and publish complete model backup
on:
  push:
    paths:
      - '.github/workflows/finalize-model-backup-20261111.yml'
  workflow_dispatch:
permissions:
  contents: write
env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  BACKUP_TAG: backup-2026-11-11
jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/export-gguf-ollama
      - name: Inspect authenticated draft inventory and verify exact bytes
        run: |
          gh api "repos/$GH_REPO/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python - "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/release-id" <<'PY'
          import json,sys
          releases=json.load(open(sys.argv[1]))
          matches=[r for r in releases if r['tag_name']=='backup-2026-11-11']
          assert len(matches)==1,[(r['tag_name'],r['draft']) for r in releases]
          release=matches[0];manifest=json.load(open('backup-manifest.json'))
          assets={a['name']:a for a in release['assets']}
          parts=[p for f in manifest['files'] for p in f['parts']]
          for p in parts:
              a=assets[p['name']]
              assert a['state']=='uploaded',p['name']
              assert a['size']==p['size'],p['name']
              assert a['digest']=='sha256:'+p['sha256'],p['name']
          assert len(parts)==21
          assert len(assets)==25,len(assets)
          assert assets['source-backup.zip']['digest']=='sha256:3ee07a68458f3e298373e74140fd2ca97e21a0651e3763aecb52ee96a184c7b3'
          open(sys.argv[2],'w').write(str(release['id']))
          print('PASS: 21/21 weight parts and source bundle match SHA-256 digests and exact sizes')
          print('Total weight bytes:',sum(p['size'] for p in parts))
          PY
          release_id=$(cat "$RUNNER_TEMP/release-id")
          gh api -X PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -f make_latest=true --jq '{html_url,draft,tag_name}'
